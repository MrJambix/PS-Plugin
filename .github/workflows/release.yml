# Uploads a plugin to Project Sylvanas when a push to main changes its version
# (plugin["version"] in scripts/<plugin>/header.lua). Other pushes upload
# nothing, so work in progress can be pushed any time.
#
# It runs tools/upload.ps1, the same script used by hand, on a Windows runner,
# so the zip is built exactly as tools/repack.ps1 builds it on the PC.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SYLVANAS_USERNAME, SYLVANAS_PASSWORD
# Plugin ids live in tools/upload.ps1.
#
# By hand: Actions > Release > Run workflow, naming the plugins.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "scripts/jcore/header.lua"
      - "scripts/jambix_aio/header.lua"
  workflow_dispatch:
    inputs:
      plugins:
        description: "Plugins to upload, space separated (jcore, jambix_aio)"
        required: true
        default: "jambix_aio"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Upload to Project Sylvanas
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick plugins
        id: pick
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ github.event.inputs.plugins }}
        run: |
          set -f
          known="jcore jambix_aio"
          ver() { grep -m1 '^plugin\["version"\]' | sed 's/.*= *"\([^"]*\)".*/\1/'; }
          picked=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            for p in $(echo "$REQUESTED" | tr ',' ' '); do
              case " $known " in
                *" $p "*) picked="$picked $p" ;;
                *) echo "::error::'$p' is not uploadable (known: $known)"; exit 1 ;;
              esac
            done
          elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with, so nothing is uploaded. Use Run workflow to upload by hand."
          else
            for p in $known; do
              new=$(ver < "scripts/$p/header.lua")
              old=$(git show "$BEFORE:scripts/$p/header.lua" 2>/dev/null | ver)
              if [ -n "$new" ] && [ "$new" != "$old" ]; then
                echo "$p: ${old:-none} -> $new"
                picked="$picked $p"
              else
                echo "$p: $new, unchanged"
              fi
            done
          fi
          echo "plugins=${picked# }" >> "$GITHUB_OUTPUT"

      # The shared PvP intelligence network's address and token
      # (scripts/jambix_aio/CENTRAL_NETWORK.md §9) ship in
      # modules/central_config.lua, written here from a secret so the token
      # never enters the repository. The secret holds the file's whole text
      # (copy central_config.example.lua, fill it in). Without the secret the
      # plugin ships with no central address and the network stays off.
      - name: Central network config (from a secret)
        if: steps.pick.outputs.plugins != ''
        shell: bash
        env:
          JAMBIX_CENTRAL_CONFIG: ${{ secrets.JAMBIX_CENTRAL_CONFIG }}
        # The site compiles every file and refuses the whole plugin over one
        # that is not Lua (2026-10-12: "central_config.lua:1: '=' expected
        # near '/'"), so the secret is checked first: its first line of code
        # must be `return {` and it must close with `}`. Otherwise the plugin
        # ships without the address and the run says so. Nothing of the
        # secret is printed.
        run: |
          if [ -z "$JAMBIX_CENTRAL_CONFIG" ]; then
            echo "no JAMBIX_CENTRAL_CONFIG secret: the plugin ships without a central address"
            exit 0
          fi
          text=$(printf '%s\n' "$JAMBIX_CENTRAL_CONFIG" | tr -d '\r')
          first=$(printf '%s\n' "$text" | grep -v '^[[:space:]]*--' | grep -v '^[[:space:]]*$' | head -1)
          last=$(printf '%s\n' "$text" | grep -v '^[[:space:]]*--' | grep -v '^[[:space:]]*$' | tail -1)
          case "$first" in
            return*"{"*) ok_first=1 ;;
            *) ok_first=0 ;;
          esac
          case "$last" in
            *"}"*) ok_last=1 ;;
            *) ok_last=0 ;;
          esac
          if [ "$ok_first" = 1 ] && [ "$ok_last" = 1 ]; then
            printf '%s\n' "$text" > scripts/jambix_aio/modules/central_config.lua
            echo "central_config.lua written from the JAMBIX_CENTRAL_CONFIG secret"
          else
            echo "::warning::JAMBIX_CENTRAL_CONFIG is not central_config.lua's Lua text (its first line of code must be 'return {' and it must end with '}'): the plugin ships without a central address. Paste the whole file into the secret."
          fi

      - name: Upload
        if: steps.pick.outputs.plugins != ''
        shell: powershell
        env:
          SYLVANAS_USERNAME: ${{ secrets.SYLVANAS_USERNAME }}
          SYLVANAS_PASSWORD: ${{ secrets.SYLVANAS_PASSWORD }}
          PLUGINS: ${{ steps.pick.outputs.plugins }}
        run: |
          if (-not $env:SYLVANAS_USERNAME -or -not $env:SYLVANAS_PASSWORD) {
              throw "add the SYLVANAS_USERNAME and SYLVANAS_PASSWORD secrets"
          }
          $names = @($env:PLUGINS -split '\s+' | Where-Object { $_ })
          & .\tools\upload.ps1 @names -Yes
