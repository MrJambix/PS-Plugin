# The Jambix central PvP intelligence network, with this repository as the
# service (scripts/jambix_aio/CENTRAL_NETWORK.md §9).
#
# The clients open issues titled "jambix-fight <id>" (one per fight, its
# lesson and its batch; older clients send "jambix-batch <id>" and
# "jambix-lesson <id>") or "jambix-delete <contributor>" with a fenced JSON body, using a
# fine-grained token that can only open issues here and read contents. This
# workflow files the open issues into the data branch (jambix-data:
# data/batches.jsonl, data/lessons.jsonl) once an hour, answers and closes
# each, and every six hours also runs a learning cycle that publishes a model version
# (data/models/vN.json + manifest.json) the clients download when its
# gates pass. Refused issues get the reason in a comment.
#
# The scheduled run is a learning cycle (tools/fightlog_server/release.js):
# the candidate is built from every accepted record, judged on the fights
# it never saw, and published as a canary only when the gates pass; a
# "promote <version>" by hand rolls a canary out to everyone.
#
# Hourly, not on each issue (2026-10-12): every run is billed at least a
# minute of the private repository's Actions minutes, so one run per issue
# grows with the players; once an hour is some 30 runs a day whatever comes
# in. An issue waits up to an hour to be filed.
#
# The repository variable JAMBIX_MIN_CONTRIBUTORS (Settings > Secrets and
# variables > Actions > Variables) sets how many players a habit, a tactic
# and a release need; unset, 2.
#
# By hand: Actions > Jambix central > Run workflow ("ingest", "publish",
# "publish --force", "promote <version>", "withdraw <version>" or "evaluate").

name: Jambix central

on:
  schedule:
    - cron: "7 * * * *"          # file the issues
    - cron: "17 */6 * * *"       # file, then learn
  workflow_dispatch:
    inputs:
      action:
        description: "ingest | publish [--force] | promote <version> | withdraw <version> | evaluate"
        required: true
        default: "ingest"

concurrency:
  group: jambix-central
  cancel-in-progress: false

jobs:
  central:
    name: File the issues, publish the model
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      DATA_BRANCH: jambix-data
    steps:
      - name: Checkout main (the tools)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout the data branch beside it
        shell: bash
        run: |
          set -e
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git worktree add data-branch "origin/$DATA_BRANCH"
            (cd data-branch && git checkout -B "$DATA_BRANCH")
          else
            git worktree add --detach data-branch
            (cd data-branch && git checkout --orphan "$DATA_BRANCH" && git rm -rfq . && mkdir -p data/models && echo "# Jambix central data" > README.md)
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DATA_DIR: ${{ github.workspace }}/data-branch/data
          ACTION: ${{ github.event.inputs.action }}
          SCHEDULE: ${{ github.event.schedule }}
          MIN_CONTRIBUTORS: ${{ vars.JAMBIX_MIN_CONTRIBUTORS }}
        run: |
          set -e
          case "$GITHUB_EVENT_NAME" in
            schedule)
              node tools/fightlog_server/github_ingest.js ingest
              if [ "$SCHEDULE" = "17 */6 * * *" ]; then node tools/fightlog_server/github_ingest.js publish "scheduled"; fi ;;
            workflow_dispatch)
              set -- $ACTION
              case "$1" in
                ingest) node tools/fightlog_server/github_ingest.js ingest ;;
                publish) shift; node tools/fightlog_server/github_ingest.js publish "$@" "by hand" ;;
                promote) node tools/fightlog_server/github_ingest.js promote "$2" ;;
                withdraw) node tools/fightlog_server/github_ingest.js withdraw "$2" ;;
                evaluate) node tools/fightlog_server/github_ingest.js evaluate ;;
                *) echo "unknown action: $ACTION"; exit 1 ;;
              esac ;;
          esac

      - name: Commit the data branch
        shell: bash
        run: |
          set -e
          cd data-branch
          git config user.name "jambix-central"
          git config user.email "jambix-central@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "central: ${GITHUB_EVENT_NAME} $(date -u +%FT%TZ)"
          git push origin "HEAD:$DATA_BRANCH"
